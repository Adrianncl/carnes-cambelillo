<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Contacto | Carnes Cambelillo</title>

		<link rel="stylesheet" href="../css/contacto.css">
	</head>

	<body>
		<header class="cabecera">
			<div class="contenedor">

				<div class="marca">
					<img class="logo" src="../imágenes/cambelillo.png" alt="Logo Carnes Cambelillo">
					<h1>Carnes Cambelillo</h1>
					<p>Charcutería · Pollería · Carnicería</p>
				</div>

				<nav class="menu-principal">
					<a href="../index.html">Inicio</a>
					<a href="SERVICIOS.html">Servicios</a>
					<a href="PRODUCTOS.html">Productos</a>
					<a href="contacto.html">Contacto</a>
				</nav>

				<div class="limpiar"></div>

			</div>
		</header>

		<main class="contenedor">
			<section class="seccion">
				<h2>Formulario de Contacto</h2>

				<form action="#" method="post" class="formulario">

					<p class="campo">
						<label for="nombre">Nombre:</label>
						<input type="text" id="nombre" name="nombre" required>
					</p>

					<p class="campo">
						<label for="apellidos">Apellidos:</label>
						<input type="text" id="apellidos" name="apellidos">
					</p>

					<p class="campo">
						<label for="email">Correo electrónico:</label>
						<input type="email" id="email" name="email" required>
					</p>

					<p class="campo">
						<label for="telefono">Teléfono:</label>
						<input type="tel" id="telefono" name="telefono">
					</p>

					<p class="campo">
						<label for="asunto">Asunto:</label>
						<select id="asunto" name="asunto">
							<option value="pedido">Duda sobre un pedido</option>
							<option value="producto">Consulta de producto</option>
							<option value="horario">Horario / tienda</option>
							<option value="otros">Otros</option>
						</select>
					</p>

					<p class="campo">
						<label for="mensaje">Mensaje:</label>
						<textarea id="mensaje" name="mensaje" rows="6" required></textarea>
					</p>

					<p class="campo">
						<label>
							<input type="checkbox" name="acepto" required>
							Acepto que se usen mis datos para responder a mi consulta.
						</label>
					</p>

					<p class="acciones">
						<button type="submit" class="boton">Enviar</button>
						<a class="boton-secundario" href="../index.html">Volver a Inicio</a>
					</p>

				</form>
			</section>
		</main>

		<footer class="pie">
			<div class="contenedor">
				<p>
					<a href="../index.html">Inicio</a> ·
					<a href="SERVICIOS.html">Servicios</a> ·
					<a href="PRODUCTOS.html">Productos</a> ·
					<a href="contacto.html">Contacto</a>
				</p>
			</div>
		</footer>
	</body>
</html>
